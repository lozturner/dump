<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#cfe8ff"/>
      <stop offset="100%" stop-color="#f5f9ff"/>
    </linearGradient>
    <linearGradient id="booth" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5deb3"/>
      <stop offset="100%" stop-color="#d2a679"/>
    </linearGradient>
    <radialGradient id="pillShine" cx="0.3" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Pavement -->
  <rect y="620" width="1200" height="180" fill="#b8bcc2"/>
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#8a8e94" stroke-width="2"/>
  <g stroke="#8a8e94" stroke-width="1" opacity="0.5">
    <line x1="0" y1="680" x2="1200" y2="680"/>
    <line x1="0" y1="740" x2="1200" y2="740"/>
  </g>

  <!-- Pure Gym building behind -->
  <rect x="40" y="120" width="1120" height="500" fill="#2a2a2a"/>
  <rect x="40" y="120" width="1120" height="40" fill="#000"/>
  <text x="80" y="150" fill="#ffd400" font-size="28" font-weight="900" letter-spacing="2">PURE GYM</text>
  <g fill="#3a3a3a">
    <rect x="80"  y="200" width="180" height="380"/>
    <rect x="300" y="200" width="180" height="380"/>
    <rect x="720" y="200" width="180" height="380"/>
    <rect x="940" y="200" width="180" height="380"/>
  </g>
  <g fill="#4f6fa8" opacity="0.6">
    <rect x="92"  y="212" width="156" height="356"/>
    <rect x="312" y="212" width="156" height="356"/>
    <rect x="732" y="212" width="156" height="356"/>
    <rect x="952" y="212" width="156" height="356"/>
  </g>

  <!-- Gym doors -->
  <rect x="520" y="360" width="180" height="260" fill="#111"/>
  <rect x="528" y="368" width="80" height="244" fill="#5b8def" opacity="0.5"/>
  <rect x="612" y="368" width="80" height="244" fill="#5b8def" opacity="0.5"/>
  <text x="610" y="345" fill="#ffd400" font-size="14" font-weight="700" text-anchor="middle">EXIT</text>

  <!-- Booth structure -->
  <g transform="translate(760,320)">
    <!-- Canopy -->
    <rect x="0" y="0" width="380" height="40" fill="url(#booth)"/>
    <rect x="0" y="0" width="380" height="40" fill="none" stroke="#14401a" stroke-width="2"/>
    <!-- Stripes -->
    <g fill="#f1c40f">
      <rect x="10"  y="8" width="30" height="24" rx="2"/>
      <rect x="80"  y="8" width="30" height="24" rx="2"/>
      <rect x="150" y="8" width="30" height="24" rx="2"/>
      <rect x="220" y="8" width="30" height="24" rx="2"/>
      <rect x="290" y="8" width="30" height="24" rx="2"/>
    </g>
    <!-- Sign -->
    <rect x="30" y="-70" width="320" height="70" fill="#1b5e20" stroke="#f1c40f" stroke-width="3" rx="6"/>
    <text x="190" y="-40" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">HOLLAND &amp; BARRETT  ×  PURE GYM</text>
    <text x="190" y="-15" fill="#f1c40f" font-size="22" font-weight="900" text-anchor="middle">BUILD YOUR OWN STACK</text>

    <!-- Back wall -->
    <rect x="0" y="40" width="380" height="200" fill="#e8f1ea"/>
    <!-- Shelves with bottles -->
    <g transform="translate(20,60)">
      <rect x="0" y="40" width="340" height="4" fill="#8a6a3c"/>
      <rect x="0" y="100" width="340" height="4" fill="#8a6a3c"/>
      <rect x="0" y="160" width="340" height="4" fill="#8a6a3c"/>
      <!-- Row 1 bottles -->
      <g>
        <g transform="translate(10,4)"><rect width="30" height="36" fill="#1e88e5" rx="3"/><rect y="-4" width="30" height="8" fill="#0d47a1" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">B12</text></g>
        <g transform="translate(55,4)"><rect width="30" height="36" fill="#fb8c00" rx="3"/><rect y="-4" width="30" height="8" fill="#e65100" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">D3</text></g>
        <g transform="translate(100,4)"><rect width="30" height="36" fill="#6a1b9a" rx="3"/><rect y="-4" width="30" height="8" fill="#4a148c" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">CREATINE</text></g>
        <g transform="translate(145,4)"><rect width="30" height="36" fill="#c62828" rx="3"/><rect y="-4" width="30" height="8" fill="#8b0000" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">IRON</text></g>
        <g transform="translate(190,4)"><rect width="30" height="36" fill="#00897b" rx="3"/><rect y="-4" width="30" height="8" fill="#004d40" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">ZINC</text></g>
        <g transform="translate(235,4)"><rect width="30" height="36" fill="#fdd835" rx="3"/><rect y="-4" width="30" height="8" fill="#f9a825" rx="2"/><text x="15" y="24" fill="#333" font-size="8" text-anchor="middle" font-weight="700">C</text></g>
        <g transform="translate(280,4)"><rect width="30" height="36" fill="#5d4037" rx="3"/><rect y="-4" width="30" height="8" fill="#3e2723" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">ASH</text></g>
      </g>
      <!-- Row 2 -->
      <g transform="translate(0,60)">
        <g transform="translate(10,4)"><rect width="30" height="36" fill="#43a047" rx="3"/><rect y="-4" width="30" height="8" fill="#1b5e20" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">GREENS</text></g>
        <g transform="translate(55,4)"><rect width="30" height="36" fill="#ef5350" rx="3"/><rect y="-4" width="30" height="8" fill="#b71c1c" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">BEET</text></g>
        <g transform="translate(100,4)"><rect width="30" height="36" fill="#039be5" rx="3"/><rect y="-4" width="30" height="8" fill="#01579b" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">OMEGA</text></g>
        <g transform="translate(145,4)"><rect width="30" height="36" fill="#ab47bc" rx="3"/><rect y="-4" width="30" height="8" fill="#4a148c" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">MAG</text></g>
        <g transform="translate(190,4)"><rect width="30" height="36" fill="#ff7043" rx="3"/><rect y="-4" width="30" height="8" fill="#bf360c" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">BCAA</text></g>
        <g transform="translate(235,4)"><rect width="30" height="36" fill="#90a4ae" rx="3"/><rect y="-4" width="30" height="8" fill="#455a64" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">TAU</text></g>
        <g transform="translate(280,4)"><rect width="30" height="36" fill="#f06292" rx="3"/><rect y="-4" width="30" height="8" fill="#880e4f" rx="2"/><text x="15" y="24" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">COLL</text></g>
      </g>
      <!-- Row 3 (pills visible) -->
      <g transform="translate(0,120)">
        <g transform="translate(10,8)"><rect width="300" height="28" fill="#fff" stroke="#ccc" rx="4"/>
          <!-- Scattered pills -->
          <g>
            <circle cx="20" cy="14" r="6" fill="#e53935"/>
            <circle cx="35" cy="14" r="6" fill="#fbc02d"/>
            <rect x="45" y="10" width="16" height="8" rx="4" fill="#1e88e5"/>
            <rect x="68" y="10" width="16" height="8" rx="4" fill="#43a047"/>
            <circle cx="95" cy="14" r="6" fill="#8e24aa"/>
            <circle cx="110" cy="14" r="6" fill="#fff" stroke="#999"/>
            <rect x="122" y="10" width="16" height="8" rx="4" fill="#ff7043"/>
            <circle cx="150" cy="14" r="6" fill="#00897b"/>
            <rect x="162" y="10" width="16" height="8" rx="4" fill="#c62828"/>
            <circle cx="190" cy="14" r="6" fill="#fdd835"/>
            <circle cx="205" cy="14" r="6" fill="#ab47bc"/>
            <rect x="215" y="10" width="16" height="8" rx="4" fill="#039be5"/>
            <circle cx="245" cy="14" r="6" fill="#43a047"/>
            <rect x="258" y="10" width="16" height="8" rx="4" fill="#f06292"/>
            <circle cx="285" cy="14" r="6" fill="#5d4037"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Counter -->
    <rect x="0" y="240" width="380" height="80" fill="url(#counter)"/>
    <rect x="0" y="240" width="380" height="10" fill="#8a6a3c"/>

    <!-- Pick-and-mix bowls on counter -->
    <g transform="translate(20,252)">
      <!-- Bowl 1 -->
      <g>
        <ellipse cx="30" cy="30" rx="30" ry="10" fill="#444"/>
        <path d="M0,30 Q30,55 60,30 Z" fill="#666"/>
        <circle cx="18" cy="26" r="5" fill="#e53935"/>
        <circle cx="30" cy="24" r="5" fill="#fbc02d"/>
        <circle cx="42" cy="26" r="5" fill="#1e88e5"/>
        <circle cx="24" cy="30" r="5" fill="#43a047"/>
        <circle cx="38" cy="30" r="5" fill="#8e24aa"/>
      </g>
      <!-- Bowl 2 -->
      <g transform="translate(80,0)">
        <ellipse cx="30" cy="30" rx="30" ry="10" fill="#444"/>
        <path d="M0,30 Q30,55 60,30 Z" fill="#666"/>
        <rect x="14" y="22" width="14" height="7" rx="3.5" fill="#ff7043"/>
        <rect x="30" y="22" width="14" height="7" rx="3.5" fill="#039be5"/>
        <rect x="22" y="30" width="14" height="7" rx="3.5" fill="#c62828"/>
        <rect x="38" y="30" width="14" height="7" rx="3.5" fill="#00897b"/>
      </g>
      <!-- Bowl 3 -->
      <g transform="translate(160,0)">
        <ellipse cx="30" cy="30" rx="30" ry="10" fill="#444"/>
        <path d="M0,30 Q30,55 60,30 Z" fill="#666"/>
        <circle cx="18" cy="26" r="5" fill="#fdd835"/>
        <circle cx="30" cy="24" r="5" fill="#fff" stroke="#999"/>
        <circle cx="42" cy="26" r="5" fill="#ab47bc"/>
        <circle cx="24" cy="30" r="5" fill="#f06292"/>
        <circle cx="38" cy="30" r="5" fill="#5d4037"/>
      </g>
      <!-- Bowl 4 -->
      <g transform="translate(240,0)">
        <ellipse cx="30" cy="30" rx="30" ry="10" fill="#444"/>
        <path d="M0,30 Q30,55 60,30 Z" fill="#666"/>
        <rect x="14" y="22" width="14" height="7" rx="3.5" fill="#43a047"/>
        <rect x="30" y="22" width="14" height="7" rx="3.5" fill="#6a1b9a"/>
        <rect x="22" y="30" width="14" height="7" rx="3.5" fill="#fb8c00"/>
        <rect x="38" y="30" width="14" height="7" rx="3.5" fill="#1e88e5"/>
      </g>
    </g>

    <!-- Price sign -->
    <g transform="translate(300,250)">
      <circle cx="30" cy="30" r="32" fill="#f1c40f" stroke="#c29b00" stroke-width="3"/>
      <text x="30" y="30" text-anchor="middle" font-size="22" font-weight="900" fill="#1b5e20">£1</text>
      <text x="30" y="46" text-anchor="middle" font-size="8" font-weight="700" fill="#1b5e20">A PILL</text>
    </g>

    <!-- Tablet/card reader -->
    <g transform="translate(20,250)">
      <rect width="26" height="18" fill="#333" rx="2"/>
      <rect x="3" y="3" width="20" height="8" fill="#4caf50"/>
    </g>
  </g>

  <!-- Customer silhouette leaving gym -->
  <g transform="translate(690,470)">
    <circle cx="0" cy="0" r="18" fill="#3e2723"/>
    <rect x="-22" y="20" width="44" height="60" fill="#ffab91" rx="6"/>
    <rect x="-18" y="80" width="14" height="60" fill="#1a1a1a"/>
    <rect x="4"   y="80" width="14" height="60" fill="#1a1a1a"/>
    <!-- Gym bag -->
    <rect x="20" y="40" width="30" height="20" fill="#ffd400" rx="4"/>
    <text x="35" y="54" font-size="8" font-weight="900" text-anchor="middle" fill="#1b5e20">H&amp;B</text>
  </g>

  <!-- Footer tag line -->
  <rect x="0" y="760" width="1200" height="40" fill="#1b5e20"/>
  <text x="600" y="787" text-anchor="middle" fill="#f1c40f" font-size="20" font-weight="800" letter-spacing="2">POST-WORKOUT. PICK YOUR STACK. £1 A PILL.</text>
</svg>
