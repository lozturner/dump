<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Releaf — Email Chronology</title>
<style>
:root {
  --bg: #f3f4f1;
  --pane: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --soft: #9ca3af;
  --border: #e5e7eb;
  --border-soft: #f1f5f4;
  --hover: #f8fafc;
  --accent: #0f766e;
  --accent-soft: #ccfbf1;
  --accent-text: #134e4a;
  --star: #f59e0b;
  --star-soft: #fef3c7;
  --flag: #b91c1c;
  --flag-soft: #fee2e2;
  --ok: #166534;
  --ok-soft: #dcfce7;
  --info: #1d4ed8;
  --info-soft: #dbeafe;
  --purple: #6d28d9;
  --purple-soft: #ede9fe;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.06);
  --shadow-lg: 0 20px 50px rgba(0,0,0,.18);
  --sidebar-w: 232px;
  --drawer-w: 560px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
button { font: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas: "header header" "sidebar main";
  height: 100vh;
  overflow: hidden;
}

/* HEADER */
.header {
  grid-area: header;
  background: var(--pane);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.brand .dot { width: 10px; height: 10px; background: var(--accent); border-radius: 3px; }
.search { flex: 1; max-width: 540px; position: relative; }
.search input {
  width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--bg); font: inherit; transition: all .15s;
}
.search input:focus { outline: none; background: white; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search::before { content: "⌕"; position: absolute; left: 11px; top: 6px; font-size: 16px; color: var(--soft); }
.search kbd { position: absolute; right: 8px; top: 7px; padding: 2px 6px; background: white;
  border: 1px solid var(--border); border-radius: 4px; font-size: 11px; color: var(--muted); }
.header .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
.icon-btn { width: 32px; height: 32px; border-radius: 6px; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }

/* SIDEBAR */
.sidebar {
  grid-area: sidebar;
  background: var(--pane);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px 8px;
}
.sb-section { font-size: 11px; color: var(--soft); text-transform: uppercase; letter-spacing: .06em;
  padding: 12px 12px 6px; }
.sb-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px;
  color: var(--text); width: 100%; border: none; background: transparent; text-align: left;
}
.sb-item:hover { background: var(--hover); }
.sb-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
.sb-item .ic { width: 18px; text-align: center; }
.sb-item .count { margin-left: auto; font-size: 11px; color: var(--muted); }
.sb-item.active .count { color: var(--accent-text); }

/* MAIN */
.main { grid-area: main; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.toolbar {
  background: var(--pane); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; padding: 8px 16px; flex-wrap: wrap;
}
.toolbar h2 { margin: 0; font-size: 16px; font-weight: 600; }
.toolbar .toolbar-meta { color: var(--muted); font-size: 12px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.pill {
  padding: 4px 10px; font-size: 12px; border-radius: 999px; background: transparent;
  border: 1px solid var(--border); color: var(--muted);
}
.pill:hover { border-color: var(--muted); color: var(--text); }
.pill.active { background: var(--accent); color: white; border-color: var(--accent); }

.list-pane { overflow-y: auto; background: var(--bg); min-height: 0; }
/* When the gantt page is mounted, .list-pane is told it's in gantt mode by JS.
   This avoids relying on the :has() selector (which is iffy in older viewers). */
.list-pane.gantt-mode { overflow: hidden; display: flex; flex-direction: column; }
.list-pane.gantt-mode > .gantt-layout { flex: 1 1 0; min-height: 0; }
.list {
  background: var(--pane); margin: 12px 16px; border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow-sm); overflow: hidden;
}
/* Rows are <details> elements — they expand inline on click, no JS needed. */
.row { border-bottom: 1px solid var(--border-soft); background: var(--pane); }
.row:last-child { border-bottom: none; }
.row[open] { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
.row.has-note { box-shadow: inset 3px 0 0 var(--star); }
.row.selected { background: var(--accent-soft); }
.row > summary {
  list-style: none;
  cursor: pointer;
  display: grid;
  grid-template-columns: 28px 28px 220px 1fr 28px;
  gap: 10px;
  align-items: center;
  padding: 10px 14px;
  transition: background .08s;
}
.row > summary::-webkit-details-marker { display: none; }
.row > summary::marker { display: none; }
.row > summary:hover { background: var(--hover); }
.row[open] > summary { border-bottom: 1px solid var(--border-soft); }
.row[open] > summary .chev-marker { transform: rotate(90deg); }
.row .chev-marker { color: var(--soft); text-align: center; transition: transform .15s; display: inline-block; }
.row .has-body { color: var(--accent); font-size: 10px; margin-left: 4px; vertical-align: middle; }
.row .star, .row .flag {
  background: transparent; border: none; padding: 0; color: var(--soft); font-size: 16px; line-height: 1;
  display: flex; align-items: center; justify-content: center; height: 28px;
}
.row .star.on { color: var(--star); }
.row .flag.on { color: var(--flag); }
.row .meta {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0;
}
.row .meta .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
.row .meta .cat-tag { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.row .sub { min-width: 0; }
.row .sub .subj {
  font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row .sub .snip {
  font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-top: 2px;
}
/* Expanded body — visible when <details> is open */
.row-expanded { padding: 14px 18px 18px; background: white; }
.meta-grid {
  display: grid; grid-template-columns: 90px 1fr; gap: 4px 14px;
  font-size: 13px; margin: 0 0 14px;
  padding: 10px 12px; background: var(--bg); border-radius: 6px;
}
.meta-grid dt { color: var(--muted); }
.meta-grid dd { margin: 0; word-break: break-word; }
.meta-grid code { font-size: 11px; color: var(--muted); }
.block-label { font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; }
.summary-text { font-size: 13.5px; line-height: 1.55; margin: 4px 0 8px; }
.body-block { margin: 8px 0; }
.body-text {
  background: var(--bg); padding: 12px 14px; border-radius: 8px;
  font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  white-space: pre-wrap; word-wrap: break-word; margin: 0;
  max-height: 480px; overflow-y: auto;
  border: 1px solid var(--border-soft);
}
.muted-block { background: #fef9e7; padding: 12px 14px; border-radius: 8px; border: 1px solid #fde68a; }
.row-notes { margin: 14px 0; }
.note-inline { width: 100%; min-height: 60px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 6px; font: inherit; resize: vertical;
  background: #fffbe7; }
.note-inline:focus { outline: 2px solid var(--star); border-color: var(--star); background: white; }
.row-actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }

.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 500; background: var(--accent-soft); color: var(--accent-text);
  white-space: nowrap;
}
.tag.warn { background: var(--flag-soft); color: var(--flag); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.info { background: var(--info-soft); color: var(--info); }
.tag.purple { background: var(--purple-soft); color: var(--purple); }
.tag.muted { background: #f1f5f9; color: var(--muted); }
.dir { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; letter-spacing: .03em; }
.dir.Inbound { background: var(--purple-soft); color: var(--purple); }
.dir.Outbound { background: var(--star-soft); color: #92400e; }

/* DRAWER */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: var(--drawer-w); max-width: 100vw;
  background: var(--pane); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg);
  transform: translateX(100%); transition: transform .22s ease; z-index: 50;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.drawer.open { transform: translateX(0); }
#drawerContent {
  flex: 1; display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
}
.drawer-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
  background: var(--pane); position: sticky; top: 0; z-index: 1;
}
.drawer-header .actions { margin-left: auto; display: flex; gap: 4px; }
.drawer-body { padding: 0; overflow-y: auto; flex: 1; background: var(--bg); }
.drawer-body h3 { margin: 0 0 4px; font-size: 18px; }
.drawer-body .meta-grid { display: grid; grid-template-columns: 60px 1fr; gap: 6px 12px; font-size: 13px;
  padding: 12px 0; border-bottom: 1px solid var(--border-soft); margin-bottom: 12px; }
.drawer-body .meta-grid dt { color: var(--muted); }
.drawer-body .meta-grid dd { margin: 0; word-break: break-word; }
.section-title { font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
.summary-box { background: var(--bg); padding: 12px; border-radius: 8px; font-size: 13.5px; line-height: 1.55; }
.note-area {
  width: 100%; min-height: 80px; padding: 10px; border: 1px solid var(--border);
  border-radius: 8px; font: inherit; resize: vertical; background: #fffbe7;
}
.note-area:focus { outline: 2px solid var(--star); border-color: var(--star); background: white; }
.tag-input-wrap { display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  padding: 6px; border: 1px solid var(--border); border-radius: 8px; min-height: 38px; }
.tag-input-wrap input { border: none; flex: 1; min-width: 100px; padding: 4px; font: inherit; outline: none; background: transparent; }
.tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  background: var(--accent-soft); color: var(--accent-text); border-radius: 999px; font-size: 12px; }
.tag-chip button { background: transparent; border: none; padding: 0; color: var(--accent-text); font-weight: bold; line-height: 1; }
.gm-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--accent);
  color: white; border: none; border-radius: 8px; font-weight: 500;
}
.gm-btn:hover { background: #115e59; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; opacity: 0;
  pointer-events: none; transition: opacity .2s; }
.scrim.show { opacity: 1; pointer-events: auto; }
/* When the cell drawer is open we keep the Gantt visible underneath:
   no dimming, AND pointer events pass through so you can still click
   other green cells (or anything else) without the scrim swallowing them. */
.scrim.show.no-dim { background: transparent; opacity: 0; pointer-events: none; }

/* PAGES: stats, timeline */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; padding: 16px; }
.stat-card { background: var(--pane); border: 1px solid var(--border); border-radius: 10px; padding: 16px; box-shadow: var(--shadow-sm); }
.stat-card .n { font-size: 28px; font-weight: 600; }
.stat-card .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.cat-list { padding: 0 16px 16px; }
.cat-list .cat-card { background: var(--pane); border: 1px solid var(--border); border-radius: 10px; padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 12px; }
.cat-list h3 { margin: 0 0 12px; font-size: 15px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 40px; gap: 10px; align-items: center; font-size: 12px; padding: 4px 0; }
.bar { background: var(--bg); border-radius: 4px; height: 14px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

.tl { padding: 16px; }
.tl-month-h { font-weight: 600; color: var(--muted); margin: 18px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); padding-top: 8px; z-index: 1; }
.tl-card { background: var(--pane); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow-sm); }
.tl-card:hover { border-color: var(--accent); }
.tl-card .head { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.tl-card .subj { font-weight: 500; margin: 4px 0 2px; }
.tl-card .summary { font-size: 13px; color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
.empty .ic { font-size: 36px; opacity: .4; }

/* GANTT */
.gantt { padding: 16px; overflow-x: auto; }
.g-grid { display: grid; gap: 2px; align-items: center; min-width: 720px; }
.g-year { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0; font-weight: 600;
  border-bottom: 1px solid var(--border); background: var(--bg); }
.g-month { font-size: 10px; text-align: center; color: var(--soft); padding: 2px 0;
  background: var(--bg); border-bottom: 1px solid var(--border); text-transform: uppercase; }
.g-rowlabel { padding: 4px 8px; font-size: 12px; background: var(--pane); border-radius: 4px;
  display: flex; align-items: center; gap: 6px; min-width: 0; }
.g-count { color: var(--muted); font-size: 11px; margin-left: auto; }
.g-cell { background: #eef2ee; height: 24px; border-radius: 3px; font-size: 10px;
  display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;
  transition: transform .08s, box-shadow .08s, outline-color .1s; outline: 2px solid transparent; outline-offset: -1px; }
.g-cell.on { cursor: pointer; }
.g-cell.on:hover { outline-color: var(--accent); transform: scale(1.08); box-shadow: 0 2px 8px rgba(15,118,110,.3); z-index: 1; position: relative; }
.g-cell.on.selected { outline: 3px solid var(--star); outline-offset: -2px;
  box-shadow: 0 0 0 4px var(--star-soft), 0 2px 8px rgba(245,158,11,.3); position: relative; z-index: 2; }
.g-legend { display: flex; gap: 14px; align-items: center; margin-top: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.g-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }

/* METHODOLOGY PAGE */
.meth { padding: 16px; display: grid; gap: 12px; }
.meth-card { background: var(--pane); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; box-shadow: var(--shadow-sm); }
.meth-card h2 { margin: 0 0 8px; font-size: 18px; }
.meth-card h3 { margin: 0 0 10px; font-size: 15px; }
.meth-card ol { padding-left: 22px; margin: 10px 0; line-height: 1.6; }
.meth-card ol li { margin-bottom: 8px; }
.meth-card code { background: var(--bg); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
.meth-card ul.kv { list-style: none; padding: 0; margin: 6px 0; }
.meth-card ul.kv li { padding: 4px 0; border-bottom: 1px dashed var(--border-soft); }
.meth-card ul.kv li:last-child { border-bottom: none; }
.meth-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.meth-tbl th, .meth-tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border-soft); text-align: left; }
.meth-tbl thead th { font-size: 11px; text-transform: uppercase; color: var(--muted); }
.raw-json { background: var(--bg); padding: 12px; border-radius: 6px; font-size: 11px;
  max-height: 420px; overflow: auto; line-height: 1.4; white-space: pre; }

/* No-JS notice banner */
.no-js-notice { display: none; }
.no-js .no-js-notice { display: block; padding: 10px 16px; background: #fef3c7;
  border-bottom: 1px solid #fde68a; font-size: 12px; color: #92400e; }

/* Pin / Add-to-chronology */
.pin-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
  border: 1px solid var(--accent); background: white; color: var(--accent-text);
  border-radius: 8px; cursor: pointer; font-weight: 500;
}
.pin-btn:hover { background: var(--accent-soft); }
.pin-btn.pinned { background: var(--accent); color: white; border-color: var(--accent); }
.pin-note-form {
  margin-top: 8px; padding: 12px; background: #fffbe7; border: 1px solid var(--star);
  border-radius: 8px;
}
.pin-note-form textarea {
  width: 100%; min-height: 60px; padding: 8px; border: 1px solid var(--border);
  border-radius: 6px; font: inherit; resize: vertical; margin-bottom: 8px;
}
.pin-note-form .actions { display: flex; gap: 8px; }
.pin-note-form button {
  padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: white; cursor: pointer;
}
.pin-note-form button.save { background: var(--accent); color: white; border-color: var(--accent); }
.pin-note-form button.save:hover { background: #115e59; }

/* System chronology narrative */
.chron-narrative { padding: 20px; max-width: 820px; margin: 0 auto; }
.chron-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.chron-header h2 { margin: 0 0 6px; font-size: 22px; }
.chron-phase {
  background: var(--pane); border: 1px solid var(--border); border-radius: 10px;
  padding: 18px 22px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
}
.chron-phase header { margin-bottom: 8px; }
.chron-phase header h3 { margin: 4px 0 0; font-size: 17px; }
.chron-when {
  display: inline-block; padding: 2px 10px; background: var(--accent-soft);
  color: var(--accent-text); border-radius: 999px; font-size: 12px; font-weight: 600;
}
.chron-phase p { line-height: 1.6; margin: 8px 0; }
.chron-ref {
  display: inline-block; padding: 0 4px; margin-left: 1px; background: var(--bg);
  border-radius: 3px; font-size: 11px; color: var(--accent); cursor: pointer;
  text-decoration: none; border: 1px solid var(--border-soft);
}
.chron-ref:hover { background: var(--accent-soft); border-color: var(--accent); }
.chron-summary { background: var(--accent-soft); border-color: var(--accent); }
.chron-summary h3 { color: var(--accent-text); }

/* My chronology */
.my-chron { padding: 16px; max-width: 820px; margin: 0 auto; }
.my-chron-empty {
  text-align: center; padding: 60px 20px; background: var(--pane);
  border: 2px dashed var(--border); border-radius: 12px;
}
.my-chron-empty .ic { font-size: 40px; opacity: .4; margin-bottom: 12px; }
.my-chron-empty h3 { margin: 0 0 6px; }
.my-chron-empty p { color: var(--muted); margin: 6px 0; }
.my-chron-actions { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
.my-chron-item {
  background: var(--pane); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 18px; margin-bottom: 10px; box-shadow: var(--shadow-sm);
  border-left: 4px solid var(--accent);
}
.my-chron-item .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.my-chron-item .head .when { color: var(--muted); font-size: 12px; }
.my-chron-item .subj { font-weight: 600; margin: 4px 0; }
.my-chron-item .summary { color: var(--muted); font-size: 13px; margin: 4px 0; }
.my-chron-item .my-note {
  background: #fffbe7; padding: 10px 12px; border-radius: 6px; margin-top: 10px;
  font-size: 13px; line-height: 1.5; border-left: 3px solid var(--star);
}
.my-chron-item .my-note-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--muted);
  letter-spacing: .04em; margin-bottom: 4px;
}
.my-chron-item .item-actions { margin-top: 10px; display: flex; gap: 8px; }
.my-chron-item .item-actions button, .my-chron-item .item-actions a {
  padding: 5px 10px; font-size: 12px; border-radius: 6px;
  border: 1px solid var(--border); background: white; cursor: pointer; color: var(--text);
  text-decoration: none;
}
.my-chron-item .item-actions button.remove { color: var(--flag); border-color: #fecaca; }
.my-chron-item .item-actions button.remove:hover { background: var(--flag-soft); }

/* ─── Visual timeline split-pane layout (gantt + reading pane side-by-side) ─── */
.gantt-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 460px;
  grid-template-rows: 1fr;
  height: 100%;
  min-height: 0;
  position: relative;
}
.gantt-layout.pane-hidden { grid-template-columns: minmax(0, 1fr) 0; }
.gantt-layout.pane-hidden .reading-pane { display: none; }
.gantt-scroll { overflow: auto; min-width: 0; min-height: 0; }
.reading-pane {
  border-left: 1px solid var(--border);
  background: var(--pane);
  display: flex; flex-direction: column;
  min-height: 0; min-width: 0; overflow: hidden;
  box-shadow: -8px 0 24px rgba(0,0,0,.04);
}
.pane-toggle {
  position: absolute; top: 50%; right: 460px; transform: translateY(-50%) translateX(50%);
  width: 22px; height: 60px; border-radius: 6px 0 0 6px;
  background: var(--pane); border: 1px solid var(--border); border-right: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--muted); z-index: 5; box-shadow: -2px 0 6px rgba(0,0,0,.04);
  font-size: 14px; padding: 0;
}
.pane-toggle:hover { color: var(--accent); border-color: var(--accent); }
.gantt-layout.pane-hidden .pane-toggle {
  right: 0; transform: translateY(-50%);
  border-radius: 6px 0 0 6px;
}
.reading-pane-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  padding: 40px 24px; text-align: center; color: var(--muted);
}
.reading-pane-empty .empty-icon { font-size: 38px; opacity: .4; margin-bottom: 4px; }
.reading-pane-empty h3 { margin: 0; color: var(--text); font-size: 15px; font-weight: 600; }
.reading-pane-empty p { margin: 0; font-size: 12px; }
.reading-pane-empty .hint { font-size: 11px; color: var(--soft); margin-top: 10px; }

/* Rows inside the reading pane use the compact two-row layout regardless of viewport width */
.pane-rows .row > summary {
  grid-template-columns: 28px 28px 1fr auto;
  grid-template-rows: auto auto;
  gap: 4px 10px;
}
.pane-rows .row > summary > .star { grid-column: 1; grid-row: 1; }
.pane-rows .row > summary > .flag { grid-column: 2; grid-row: 1; }
.pane-rows .row > summary > .meta {
  grid-column: 3; grid-row: 1;
  flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px;
}
.pane-rows .row > summary > .meta .cat-tag { font-size: 10px; padding: 1px 6px; }
.pane-rows .row > summary > .chev-marker { grid-column: 4; grid-row: 1; }
.pane-rows .row > summary > .sub { grid-column: 1 / -1; grid-row: 2; min-width: 0; }
.pane-rows .row > summary > .sub .subj { white-space: normal; font-size: 14px; line-height: 1.35; font-weight: 600; }
.pane-rows .row > summary > .sub .snip {
  white-space: normal;
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
  line-height: 1.4;
}
@media (max-width: 1100px) {
  .gantt-layout { grid-template-columns: minmax(0, 1fr) 380px; }
  .pane-toggle { right: 380px; }
}
@media (max-width: 900px) {
  .gantt-layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr auto; }
  .reading-pane { border-left: none; border-top: 1px solid var(--border); max-height: 55vh; }
  .pane-toggle { display: none; }
}
.pane-header {
  flex: 0 0 64px; display: flex; align-items: center; gap: 12px;
  padding: 0 18px; background: #fafbf9; border-bottom: 1px solid var(--border);
}
.pane-header .icon-tile {
  width: 36px; height: 36px; flex-shrink: 0;
  background: var(--accent-soft); color: var(--accent-text);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.pane-header .ph-text { flex: 1; min-width: 0; }
.pane-header .ph-text h2 {
  margin: 0; font-size: 15px; font-weight: 600; line-height: 1.2;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pane-header .ph-text p { margin: 2px 0 0; font-size: 11px; color: var(--muted); font-weight: 500; }
.pane-header .ph-actions { display: flex; gap: 4px; flex-shrink: 0; }
.pane-back, .pane-close {
  width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); cursor: pointer; font-size: 16px;
}
.pane-back:hover, .pane-close:hover { background: var(--border-soft); color: var(--text); }
.pane-back { margin-right: 4px; }

.pane-body { flex: 1 1 0; overflow-y: auto; background: var(--pane); min-height: 0; }

/* List view rows — Gmail mobile style */
.cell-list-empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.cell-list-row {
  padding: 14px 16px;
  display: flex; gap: 12px;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
  transition: background .08s;
}
.cell-list-row:hover { background: var(--hover); }
.cell-list-row .unread-dot {
  width: 8px; height: 8px; border-radius: 50%;
  margin-top: 6px; flex-shrink: 0; background: transparent;
}
.cell-list-row.outbound .unread-dot { background: var(--star); }
.cell-list-row.has-body .unread-dot { background: var(--accent); }
.cell-list-row .row-content { flex: 1; min-width: 0; }
.cell-list-row .row-top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  margin-bottom: 3px;
}
.cell-list-row .row-sender {
  font-size: 12px; font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cell-list-row .row-date { font-size: 11px; color: var(--muted); flex-shrink: 0; }
.cell-list-row .row-subj {
  font-size: 13px; color: var(--text); font-weight: 500; margin-bottom: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cell-list-row .row-snip {
  font-size: 12px; color: var(--muted); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.cell-list-row .row-chev {
  align-self: center; flex-shrink: 0; color: var(--soft); font-size: 18px;
  opacity: 0; transition: opacity .08s;
}
.cell-list-row:hover .row-chev { opacity: 1; }

/* Detail view */
.cell-detail { padding: 22px 24px; }
.cell-detail .cd-title {
  font-size: 20px; line-height: 1.3; font-weight: 700;
  margin: 0 0 18px; word-break: break-word;
}
.cell-detail .cd-sender-row {
  display: flex; gap: 12px; align-items: center;
  padding-bottom: 18px; margin-bottom: 18px;
  border-bottom: 1px solid var(--border-soft);
}
.cell-detail .cd-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 17px; flex-shrink: 0; text-transform: uppercase;
}
.cell-detail .cd-avatar.inbound { background: var(--purple-soft); color: var(--purple); }
.cell-detail .cd-avatar.outbound { background: var(--star-soft); color: #92400e; }
.cell-detail .cd-sender { font-weight: 600; word-break: break-word; font-size: 14px; }
.cell-detail .cd-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.cell-detail .cd-section-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin: 18px 0 6px;
}
.cell-detail .cd-summary {
  font-size: 13px; line-height: 1.55; padding: 12px 14px;
  background: var(--bg); border-radius: 8px;
  border-left: 3px solid var(--accent);
}
.cell-detail .cd-body {
  font-size: 13.5px; line-height: 1.65; white-space: pre-wrap;
  padding: 14px 16px; background: var(--bg); border-radius: 8px;
  border: 1px solid var(--border-soft); margin-top: 4px;
}
.cell-detail .cd-no-body {
  padding: 12px 14px; background: #fef9e7; border: 1px solid #fde68a;
  border-radius: 8px; color: #92400e; font-size: 13px;
}
.cell-detail .cd-footer {
  margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border-soft);
  display: flex; gap: 8px; flex-wrap: wrap;
}
.cell-detail .cd-footer .gm-link {
  padding: 8px 14px; background: var(--accent); color: white; border-radius: 8px;
  border: none; text-decoration: none; font-weight: 500; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
}
.cell-detail .cd-footer .gm-link:hover { background: #115e59; }
.cell-detail .cd-footer .pin-btn { font-size: 13px; padding: 8px 14px; }
.cell-detail .cd-cat-row { margin-top: 6px; }

.pane-fade-in { animation: paneFadeIn .18s ease; }
@keyframes paneFadeIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }

/* RESPONSIVE */
@media (max-width: 900px) {
  :root { --sidebar-w: 56px; --drawer-w: 100vw; }
  .sb-item span:not(.ic):not(.count) { display: none; }
  .sb-section { display: none; }
  .header .meta { display: none; }
  .search kbd { display: none; }

  /* Two-row mobile row layout: actions+meta on top, subject/summary below */
  .row {
    grid-template-columns: 28px 28px 1fr auto;
    grid-template-rows: auto auto;
    gap: 4px 10px;
    padding: 12px 14px;
  }
  .row > .star { grid-column: 1; grid-row: 1; }
  .row > .flag { grid-column: 2; grid-row: 1; }
  .row > .meta {
    grid-column: 3; grid-row: 1;
    flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px;
  }
  .row > .meta .cat-tag {
    font-size: 10px; padding: 1px 6px;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row > .chev { grid-column: 4; grid-row: 1; }
  .row > .sub { grid-column: 1 / -1; grid-row: 2; }
  .row > .sub .subj { white-space: normal; font-size: 14px; line-height: 1.35; }
  .row > .sub .snip {
    white-space: normal;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    line-height: 1.4;
  }

  .toolbar { padding: 6px 12px; }
  .toolbar h2 { font-size: 15px; }
  .pills { width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex-shrink: 0; }

  .list { margin: 8px; }
}

@media (max-width: 480px) {
  :root { --sidebar-w: 48px; }
  .sb-item { padding: 8px 6px; }
  .sb-item .count { display: none; }
  .brand { font-size: 14px; }
  .brand .dot { width: 8px; height: 8px; }
  .search input { font-size: 13px; padding: 7px 10px 7px 30px; }
  .list { margin: 6px; }
  .row { padding: 10px 12px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand"><span class="dot"></span> Releaf Chronology</div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Search subject, summary, sender…" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="meta" id="metaTotal"></div>
    <button class="icon-btn" id="exportBtn" title="Export notes &amp; tags">⤓</button>
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-section">Views</div>
    <button class="sb-item active" data-view="inbox"><span class="ic">📥</span><span>All emails</span><span class="count" id="c-inbox"></span></button>
    <button class="sb-item" data-view="starred"><span class="ic">⭐</span><span>Starred</span><span class="count" id="c-starred"></span></button>
    <button class="sb-item" data-view="flagged"><span class="ic">🚩</span><span>Flagged</span><span class="count" id="c-flagged"></span></button>
    <button class="sb-item" data-view="noted"><span class="ic">📝</span><span>With notes</span><span class="count" id="c-noted"></span></button>
    <button class="sb-item" data-view="outbound"><span class="ic">📤</span><span>Sent by you</span><span class="count" id="c-outbound"></span></button>

    <div class="sb-section">Pages</div>
    <button class="sb-item" data-view="gantt"><span class="ic">📈</span><span>Visual timeline</span></button>
    <button class="sb-item" data-view="myChron"><span class="ic">📌</span><span>My chronology</span><span class="count" id="c-myChron"></span></button>
    <button class="sb-item" data-view="sysChron"><span class="ic">📜</span><span>System story</span></button>
    <button class="sb-item" data-view="stats"><span class="ic">📊</span><span>Overview</span></button>
    <button class="sb-item" data-view="methodology"><span class="ic">🔍</span><span>Methodology</span></button>

    <div class="sb-section">Categories</div>
    <div id="categoryList"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <h2 id="viewTitle">All emails</h2>
      <span class="toolbar-meta" id="viewMeta"></span>
      <div class="pills" id="quickFilters">
        <button class="pill" data-quick="complaints">Complaints &amp; refunds</button>
        <button class="pill" data-quick="appointments">Appointments</button>
        <button class="pill" data-quick="failed">Payment failures</button>
        <button class="pill" data-quick="recent">Last 30 days</button>
      </div>
    </div>
    <div class="list-pane" id="listPane">
      <noscript>
        <div style="padding: 12px 16px; background: #fef3c7; color: #92400e; border-bottom: 1px solid var(--border); font-size: 13px;">
          JavaScript is disabled — showing static list. Filtering, search, the side drawer, and the visual timeline need JS to work.
        </div>
      </noscript>
      __INITIAL_LIST__
    </div>
  </main>
</div>

<!-- pre-rendered pages cached in <template> elements; JS swaps them into #listPane when a sidebar tab is clicked. -->
<template id="ganttTemplate">__GANTT_HTML__</template>
<template id="methodologyTemplate">__METHODOLOGY_HTML__</template>
<template id="sysChronTemplate">__SYSTEM_CHRONOLOGY_HTML__</template>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div id="drawerContent"></div>
</aside>

<script>
// ── DATA ──
const DATA = __DATA_JSON__;
DATA.sort((a,b) => a.date.localeCompare(b.date));
const BY_ID = Object.fromEntries(DATA.map(r => [r.id, r]));

// ── STATE ──
const LS = "releaf.app.v1";
function loadState() {
  try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e) { return {}; }
}
function saveState() {
  localStorage.setItem(LS, JSON.stringify({
    notes: state.notes,
    starred: [...state.starred],
    flagged: [...state.flagged],
    tags: state.tags,
    myChronology: state.myChronology,
  }));
}
const persisted = loadState();
const state = {
  view: "inbox",
  search: "",
  selectedId: null,
  quick: null,
  notes: persisted.notes || {},
  starred: new Set(persisted.starred || []),
  flagged: new Set(persisted.flagged || []),
  tags: persisted.tags || {},
  myChronology: persisted.myChronology || [],   // array of {id, note, added}
};

// ── HELPERS ──
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => new Date(iso).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
const fmtShortDate = iso => {
  const d = new Date(iso); const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", ...(sameYear ? {} : { year: "2-digit" }) });
};
const fmtMonth = iso => new Date(iso).toLocaleString("en-GB", { year: "numeric", month: "long" });

function categoryClass(cat) {
  if (/fail|bounce|missed|cancelled|complaint/i.test(cat)) return "warn";
  if (/shipped|paid|approved|ready|allowance|delivered/i.test(cat)) return "ok";
  if (/marketing|notice|external|calendar/i.test(cat)) return "muted";
  if (/support|escalat|outbound|address|gp|clinical/i.test(cat)) return "info";
  if (/booked|amended|reminder|today|imminent|rebook/i.test(cat)) return "purple";
  return "";
}

// ── CATEGORIES list (sidebar) ──
function buildCategoryList() {
  const counts = {};
  for (const r of DATA) counts[r.category] = (counts[r.category]||0) + 1;
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const html = sorted.map(([c,n]) => `
    <button class="sb-item" data-view="cat" data-cat="${esc(c)}" title="${esc(c)}">
      <span class="ic">•</span><span>${esc(c)}</span><span class="count">${n}</span>
    </button>
  `).join("");
  document.getElementById("categoryList").innerHTML = html;
}

function updateSidebarCounts() {
  document.getElementById("c-inbox").textContent = DATA.length;
  document.getElementById("c-starred").textContent = state.starred.size;
  document.getElementById("c-flagged").textContent = state.flagged.size;
  document.getElementById("c-noted").textContent = Object.values(state.notes).filter(Boolean).length;
  document.getElementById("c-outbound").textContent = DATA.filter(r => r.direction === "Outbound").length;
  const myChronEl = document.getElementById("c-myChron");
  if (myChronEl) myChronEl.textContent = state.myChronology.length;
}

// ─── My chronology — add/remove ───
function isInChronology(id) { return state.myChronology.some(x => x.id === id); }
function addToChronology(id, note) {
  if (isInChronology(id)) return;
  state.myChronology.push({ id, note: note || "", added: new Date().toISOString() });
  saveState();
  updateSidebarCounts();
  // Update the pin button visually in any rows showing this id
  document.querySelectorAll(`[data-pin-id="${id}"]`).forEach(b => {
    b.classList.add("pinned");
    b.textContent = "✓ In my chronology";
  });
}
function removeFromChronology(id) {
  state.myChronology = state.myChronology.filter(x => x.id !== id);
  saveState();
  updateSidebarCounts();
  document.querySelectorAll(`[data-pin-id="${id}"]`).forEach(b => {
    b.classList.remove("pinned");
    b.textContent = "📌 Add to my chronology";
  });
  // If we're viewing My Chronology, re-render
  if (state.view === "myChron") renderList();
}
function updateChronologyNote(id, note) {
  const item = state.myChronology.find(x => x.id === id);
  if (item) { item.note = note; saveState(); }
}

document.getElementById("metaTotal").textContent =
  DATA.length + " emails · " + fmtMonth(DATA[0].date) + " → " + fmtMonth(DATA[DATA.length-1].date);

// ── FILTERING ──
function currentRows() {
  let rows = DATA.slice();
  // View filter
  if (state.view === "starred") rows = rows.filter(r => state.starred.has(r.id));
  else if (state.view === "flagged") rows = rows.filter(r => state.flagged.has(r.id));
  else if (state.view === "noted") rows = rows.filter(r => state.notes[r.id]);
  else if (state.view === "outbound") rows = rows.filter(r => r.direction === "Outbound");
  else if (state.view === "cat" && state.category) rows = rows.filter(r => r.category === state.category);

  // Quick filter
  if (state.quick === "complaints") rows = rows.filter(r => /complaint|refund|escalat/i.test(r.category + " " + r.subject + " " + r.summary));
  else if (state.quick === "appointments") rows = rows.filter(r => /appointment|consultation/i.test(r.category + " " + r.subject));
  else if (state.quick === "failed") rows = rows.filter(r => /fail|unsuccess|bounce/i.test(r.category + " " + r.subject));
  else if (state.quick === "recent") {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
    const iso = cutoff.toISOString();
    rows = rows.filter(r => r.date >= iso);
  }

  // Search
  if (state.search) {
    const q = state.search.toLowerCase();
    rows = rows.filter(r =>
      (r.subject + " " + r.summary + " " + r.from + " " + r.to + " " + r.category + " " + (state.notes[r.id] || "") + " " + (state.tags[r.id]||[]).join(" "))
        .toLowerCase().includes(q)
    );
  }

  // Default: newest first
  rows.sort((a,b) => b.date.localeCompare(a.date));
  return rows;
}

// ── RENDER LIST ──
// We never rebuild the row HTML — it's already pre-rendered as <details>
// elements in the page. Filtering just toggles display on each row.
let cachedListNode = null;
function ensureListMounted() {
  const pane = document.getElementById("listPane");
  if (!document.querySelector("#listInner") && cachedListNode) {
    pane.innerHTML = "";
    pane.appendChild(cachedListNode);
  }
}
function renderList() {
  const pane = document.getElementById("listPane");
  if (state.view === "timeline") return renderTimeline(pane);
  if (state.view === "stats") return renderStats(pane);
  if (state.view === "gantt") return renderGantt(pane);
  if (state.view === "methodology") return renderMethodology(pane);
  if (state.view === "myChron") return renderMyChronology(pane);
  if (state.view === "sysChron") return renderSystemChronology(pane);

  ensureListMounted();
  const rows = currentRows();
  const visibleIds = new Set(rows.map(r => r.id));
  let shown = 0;
  document.querySelectorAll("#listInner > .row").forEach(row => {
    const show = visibleIds.has(row.dataset.id);
    row.style.display = show ? "" : "none";
    if (show) shown++;
  });

  const title = ({
    inbox: "All emails", starred: "Starred", flagged: "Flagged",
    noted: "With notes", outbound: "Sent by you", cat: state.category || "Category",
  })[state.view] || state.view;
  document.getElementById("viewTitle").textContent = title;
  document.getElementById("viewMeta").textContent = shown + (shown === 1 ? " email" : " emails");
}


function toggleStar(id) {
  if (state.starred.has(id)) state.starred.delete(id); else state.starred.add(id);
  saveState(); updateSidebarCounts();
  // Update all matching star buttons (inbox AND pane)
  document.querySelectorAll(`.row[data-id="${id}"] .star`).forEach(btn => {
    btn.classList.toggle("on", state.starred.has(id));
    btn.textContent = state.starred.has(id) ? "★" : "☆";
  });
  if (state.view === "starred") renderList();
}
function toggleFlag(id) {
  if (state.flagged.has(id)) state.flagged.delete(id); else state.flagged.add(id);
  saveState(); updateSidebarCounts();
  document.querySelectorAll(`.row[data-id="${id}"] .flag`).forEach(btn => {
    btn.classList.toggle("on", state.flagged.has(id));
  });
  if (state.view === "flagged") renderList();
}

// ── TIMELINE PAGE ──
function renderTimeline(pane) {
  document.getElementById("viewTitle").textContent = "Timeline";
  const rows = currentRows().slice().reverse(); // chronological
  document.getElementById("viewMeta").textContent = rows.length + " emails";
  let html = '<div class="tl">';
  let lastMonth = "";
  for (const r of rows) {
    const m = fmtMonth(r.date);
    if (m !== lastMonth) { html += `<div class="tl-month-h">${esc(m)}</div>`; lastMonth = m; }
    html += `<div class="tl-card" data-id="${r.id}">
      <div class="head">
        <span>${fmtDate(r.date)}</span>
        <span class="dir ${r.direction}">${r.direction === "Inbound" ? "IN" : "OUT"}</span>
        <span class="tag ${categoryClass(r.category)}">${esc(r.category)}</span>
        ${state.starred.has(r.id) ? '<span style="color:var(--star)">★</span>' : ''}
        ${state.flagged.has(r.id) ? '<span style="color:var(--flag)">🚩</span>' : ''}
      </div>
      <div class="subj">${esc(r.subject)}</div>
      <div class="summary">${esc(r.summary)}</div>
    </div>`;
  }
  html += '</div>';
  pane.innerHTML = html;
  pane.querySelectorAll(".tl-card").forEach(c => c.addEventListener("click", () => openDrawer(c.dataset.id)));
}

// ── GANTT PAGE ──
let selectedGanttCell = null;
function renderGantt(pane) {
  document.getElementById("viewTitle").textContent = "Visual timeline";
  document.getElementById("viewMeta").textContent = "👆 Tap a green cell — the email list appears on the right";
  // .list-pane needs flex-column mode so the internal split layout fills height.

  // Remove the class on any other view by listening to the sidebar nav (handled elsewhere)
  const tpl = document.getElementById("ganttTemplate");
  // Build the embedded split-pane layout: gantt on the left, reading pane on the right.
  pane.innerHTML = `
    <div class="gantt-layout" id="ganttLayout">
      <div class="gantt-scroll" id="ganttScroll"></div>
      <button class="pane-toggle" id="paneToggle" title="Hide/show reading pane" type="button">›</button>
      <aside class="reading-pane" id="embeddedPane">
        <div class="reading-pane-empty">
          <div class="empty-icon">📨</div>
          <h3>Select a cell on the left</h3>
          <p>Click any green cell in the timeline grid to see the emails for that month × category here.</p>
          <p class="hint">The numbers on each cell tell you how many emails are inside.</p>
        </div>
      </aside>
    </div>
  `;
  const ganttScroll = pane.querySelector("#ganttScroll");
  ganttScroll.appendChild(tpl.content.cloneNode(true));
  const embeddedPane = pane.querySelector("#embeddedPane");
  const layoutEl = pane.querySelector("#ganttLayout");
  const toggleBtn = pane.querySelector("#paneToggle");
  toggleBtn.addEventListener("click", () => {
    const hidden = layoutEl.classList.toggle("pane-hidden");
    toggleBtn.textContent = hidden ? "‹" : "›";
    toggleBtn.title = hidden ? "Show reading pane" : "Hide reading pane";
  });
  selectedGanttCell = null;
  ganttScroll.querySelectorAll(".g-cell.on").forEach(c => {
    c.setAttribute("role", "button");
    c.setAttribute("tabindex", "0");
    const open = () => {
      if (selectedGanttCell === c) {
        // toggle off
        selectedGanttCell.classList.remove("selected");
        selectedGanttCell = null;
        renderEmbeddedEmpty(embeddedPane);
        return;
      }
      if (selectedGanttCell) selectedGanttCell.classList.remove("selected");
      c.classList.add("selected");
      selectedGanttCell = c;
      renderEmbeddedList(embeddedPane, c.dataset.cat, c.dataset.month);
    };
    c.addEventListener("click", open);
    c.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
    });
  });

// Render a single email as the SAME <details class="row"> structure used
// by the inbox view. Click-to-expand inline behavior, all the same fields
// (meta-grid, summary, full body, notes, Add-to-chronology + Open in Gmail).
function renderInboxRowHtml(r) {
  const bodyInfo = BODIES[r.id];
  const hasBody = !!(bodyInfo && bodyInfo.body);
  const pinned = isInChronology(r.id);
  const starOn = state.starred.has(r.id);
  const flagOn = state.flagged.has(r.id);
  const noteVal = state.notes[r.id] || "";
  const dirShort = r.direction === "Inbound" ? "IN" : "OUT";
  const bodyBlock = hasBody
    ? `<div class="body-block"><div class="block-label">Full email body</div><pre class="body-text">${esc(bodyInfo.body)}</pre></div>`
    : `<div class="body-block muted-block"><div class="block-label">Full email body</div><p class="muted small">Only the Gmail snippet is available for this message — open it in Gmail (button below) to read the full content.</p></div>`;
  const hasNoteCls = state.notes[r.id] ? " has-note" : "";
  return `<details class="row${hasNoteCls}" data-id="${esc(r.id)}" data-cat="${esc(r.category)}" data-dir="${esc(r.direction)}" data-date="${esc(r.date)}">
    <summary class="row-summary">
      <button class="star ${starOn ? "on" : ""}" data-act="star" data-id="${esc(r.id)}" title="Star" type="button">${starOn ? "★" : "☆"}</button>
      <button class="flag ${flagOn ? "on" : ""}" data-act="flag" data-id="${esc(r.id)}" title="Flag" type="button">🚩</button>
      <div class="meta">
        <span class="when">${esc(fmtShortDate(r.date))}</span>
        <span class="dir ${esc(r.direction)}">${dirShort}</span>
        <span class="tag ${categoryClass(r.category)} cat-tag">${esc(r.category)}</span>
        ${hasBody ? '<span class="has-body" title="Full body available">●</span>' : ""}
      </div>
      <div class="sub">
        <div class="subj">${esc(r.subject)}</div>
        <div class="snip">${esc(r.summary)}</div>
      </div>
      <span class="chev-marker">▸</span>
    </summary>
    <div class="row-expanded">
      <dl class="meta-grid">
        <dt>From</dt><dd>${esc(r.from)}</dd>
        <dt>To</dt><dd>${esc(r.to)}</dd>
        <dt>Date</dt><dd>${esc(fmtDate(r.date))}</dd>
        <dt>Direction</dt><dd>${esc(r.direction)}</dd>
        <dt>Category</dt><dd><span class="tag ${categoryClass(r.category)}">${esc(r.category)}</span></dd>
        <dt>Msg ID</dt><dd><code>${esc(r.id)}</code></dd>
      </dl>
      <div class="block-label">Summary (auto-generated)</div>
      <p class="summary-text">${esc(r.summary)}</p>
      ${bodyBlock}
      <div class="row-notes" data-notes-for="${esc(r.id)}">
        <div class="block-label">Your notes <span class="muted small">(saved locally when JS is on)</span></div>
        <textarea class="note-inline" data-id="${esc(r.id)}" placeholder="Add a private note…">${esc(noteVal)}</textarea>
      </div>
      <div class="row-actions">
        <button class="pin-btn ${pinned ? "pinned" : ""}" data-pin-id="${esc(r.id)}" type="button">${pinned ? "✓ In my chronology" : "📌 Add to my chronology"}</button>
        <a class="gm-btn" href="${esc(r.url)}" target="_blank" rel="noopener">↗ Open in Gmail</a>
      </div>
    </div>
  </details>`;
}

// Wire up a single row (star/flag/notes/pin) — extracted from wireExistingRows
function wireRow(row) {
  const id = row.dataset.id;
  row.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      const aid = btn.dataset.id;
      if (btn.dataset.act === "star") toggleStar(aid);
      if (btn.dataset.act === "flag") toggleFlag(aid);
    });
  });
  const ta = row.querySelector("textarea.note-inline");
  if (ta) {
    ta.addEventListener("input", (e) => {
      const v = e.target.value.trim();
      if (v) state.notes[id] = v; else delete state.notes[id];
      // Sync has-note across all rows with the same id (inbox + pane)
      document.querySelectorAll(`.row[data-id="${id}"]`).forEach(rr => {
        rr.classList.toggle("has-note", !!state.notes[id]);
        const t2 = rr.querySelector("textarea.note-inline");
        if (t2 && t2 !== e.target) t2.value = v;
      });
      saveState(); updateSidebarCounts();
    });
  }
  wirePinButtons(row);
}

function renderEmbeddedList(paneEl, cat, month) {
  const monthLabel = new Date(month + "-01").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const emails = DATA.filter(r => r.category === cat && r.date.slice(0,7) === month)
                     .sort((a,b) => b.date.localeCompare(a.date));
  paneEl.innerHTML = `
    <div class="pane-header">
      <div class="icon-tile">${categoryIcon(cat)}</div>
      <div class="ph-text">
        <h2>${esc(cat)}</h2>
        <p>${esc(monthLabel)} · ${emails.length} ${emails.length === 1 ? "email" : "emails"}</p>
      </div>
    </div>
    <div class="pane-body pane-fade-in" id="embeddedPaneBody"></div>
  `;
  const body = paneEl.querySelector("#embeddedPaneBody");
  if (!emails.length) {
    body.innerHTML = '<div class="cell-list-empty">No emails in this cell.</div>';
    return;
  }
  // Render rows using the EXACT same HTML structure as the inbox view.
  body.innerHTML = `<div class="pane-rows list" id="paneRows">${emails.map(renderInboxRowHtml).join("")}</div>`;
  body.querySelectorAll(".row").forEach(wireRow);
}

// ─── READING PANE (right-side drawer) ──
// Two states: list view (click cell) and detail view (click row).
// Back arrow returns from detail → list. X closes the pane entirely.
let paneContext = null;   // { mode: "cell" | "single", cat?, month?, returnTo? }

function categoryIcon(cat) {
  const lc = cat.toLowerCase();
  if (/delivery|dpd|shipped/i.test(cat)) return "📦";
  if (/payment|invoice|refund/i.test(cat)) return "💳";
  if (/prescription|allowance/i.test(cat)) return "💊";
  if (/appointment|consultation|calendar/i.test(cat)) return "📅";
  if (/support|escalat|complaint/i.test(cat)) return "💬";
  if (/clinical|gp/i.test(cat)) return "🩺";
  if (/marketing|notice/i.test(cat)) return "📣";
  if (/outbound/i.test(cat)) return "✉️";
  if (/external|switch/i.test(cat)) return "🌐";
  if (/bounce|fail/i.test(cat)) return "⚠️";
  return "📧";
}

function openPane() {
  document.getElementById("drawer").classList.add("open");
  const scrim = document.getElementById("scrim");
  scrim.classList.add("show", "no-dim");
}

function closeCellDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("scrim").classList.remove("show", "no-dim");
  if (selectedGanttCell) {
    selectedGanttCell.classList.remove("selected");
    selectedGanttCell = null;
  }
  paneContext = null;
}

// --- CELL LIST VIEW ---
function openCellDrawer(cat, month) {
  const monthLabel = new Date(month + "-01").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const emails = DATA.filter(r => r.category === cat && r.date.slice(0,7) === month)
                     .sort((a,b) => b.date.localeCompare(a.date));
  paneContext = { mode: "cell", cat, month };
  renderPaneList(cat, month, monthLabel, emails);
  openPane();
}

function renderPaneList(cat, month, monthLabel, emails) {
  const root = document.getElementById("drawerContent");
  root.innerHTML = `
    <div class="pane-header">
      <div class="icon-tile">${categoryIcon(cat)}</div>
      <div class="ph-text">
        <h2>${esc(cat)}</h2>
        <p>${esc(monthLabel)} · ${emails.length} ${emails.length === 1 ? "email" : "emails"}</p>
      </div>
      <div class="ph-actions">
        <button class="pane-close" id="paneCloseBtn" title="Close (Esc)">✕</button>
      </div>
    </div>
    <div class="pane-body pane-fade-in" id="paneBody"></div>
  `;
  const body = root.querySelector("#paneBody");
  if (!emails.length) {
    body.innerHTML = '<div class="cell-list-empty">No emails in this cell.</div>';
  } else {
    body.innerHTML = emails.map(r => {
      const hasBody = !!(BODIES[r.id] && BODIES[r.id].body);
      const classes = ["cell-list-row"];
      if (r.direction === "Outbound") classes.push("outbound");
      if (hasBody) classes.push("has-body");
      return `<div class="${classes.join(" ")}" data-row-id="${esc(r.id)}">
        <div class="unread-dot" title="${hasBody ? "Full body available" : r.direction === "Outbound" ? "Sent by you" : ""}"></div>
        <div class="row-content">
          <div class="row-top">
            <span class="row-sender">${esc(r.from)}</span>
            <span class="row-date">${esc(new Date(r.date).toLocaleDateString("en-GB", { day: "numeric", month: "short" }))}</span>
          </div>
          <div class="row-subj">${esc(r.subject)}</div>
          <div class="row-snip">${esc(r.summary)}</div>
        </div>
        <div class="row-chev">›</div>
      </div>`;
    }).join("");
    body.querySelectorAll("[data-row-id]").forEach(row => {
      row.addEventListener("click", () => showEmailDetail(row.dataset.rowId, { cat, month, monthLabel }));
    });
  }
  root.querySelector("#paneCloseBtn").addEventListener("click", closeCellDrawer);
}

// --- DETAIL VIEW ---
function showEmailDetail(id, returnTo) {
  const r = BY_ID[id];
  if (!r) return;
  paneContext = { mode: "single", emailId: id, returnTo };
  renderPaneDetail(r, returnTo);
  openPane();
}

      </div>

      <div class="cell-detail">

        <div class="cd-sender-row">
          <div class="cd-avatar ${avatarClass}">${esc(avatar)}</div>
          <div>
            <div class="cd-sender">${esc(r.from)}</div>
            <div class="cd-meta">to ${esc(r.to)} · ${esc(fmtDate(r.date))}</div>
          </div>
        </div>
        <div class="cd-cat-row">
          <span class="dir ${r.direction}">${dirShort}</span>
          <span class="tag ${categoryClass(r.category)}" style="margin-left:6px">${esc(r.category)}</span>
          <span class="muted small" style="margin-left:6px">Msg ID: <code>${esc(r.id)}</code></span>
        </div>
        <div class="cd-section-label">Summary (auto-generated)</div>
        <div class="cd-summary">${esc(r.summary)}</div>
        <div class="cd-section-label">Full email body</div>
        ${hasBody
          ? `<div class="cd-body">${esc(bodyInfo.body)}</div>`
          : `<div class="cd-no-body">Only the Gmail snippet was indexed for this message — manually-written replies and your outbound emails have full bodies; automated notifications (delivery, payment receipts, calendar invites) keep only the snippet. Click "Open in Gmail" below for the original.</div>`
        }
        <div class="cd-section-label">Your notes <span class="muted small" style="text-transform:none;letter-spacing:0">(saved locally in this browser)</span></div>
        <textarea class="note-area" id="paneNoteArea" data-id="${esc(r.id)}" placeholder="Add a private note for this email…">${esc(noteVal)}</textarea>
        <div class="cd-footer">
          <a class="gm-link" href="${r.url}" target="_blank" rel="noopener">↗ Open in Gmail</a>
          <button class="pin-btn ${pinned ? "pinned" : ""}" data-pin-id="${esc(r.id)}" type="button">
            ${pinned ? "✓ In my chronology" : "📌 Add to my chronology"}

        </div>
      </div>

  wirePinButtons(root);
  root.querySelector("#paneCloseBtn").addEventListener("click", closeCellDrawer);
  // Wire the notes textarea to persist state
  const ta = root.querySelector("#paneNoteArea");
  if (ta) {
    ta.addEventListener("input", (e) => {
      const v = e.target.value.trim();
      if (v) state.notes[r.id] = v; else delete state.notes[r.id];
      saveState(); updateSidebarCounts();
      // Also reflect on the matching inline row in the inbox view
      const inlineRow = document.querySelector(`#listInner .row[data-id="${r.id}"]`);

    });
  }

// ── MY CHRONOLOGY ──
function renderMyChronology(pane) {
  document.getElementById("viewTitle").textContent = "My chronology";
  document.getElementById("viewMeta").textContent = state.myChronology.length + " pinned email" + (state.myChronology.length === 1 ? "" : "s");
  if (!state.myChronology.length) {
    pane.innerHTML = `<div class="my-chron">
      <div class="my-chron-empty">
        <div class="ic">📌</div>
        <h3>Your chronology is empty</h3>
        <p>This page is your personal narrative — emails you've curated as important.</p>
        <p class="small">To add: open <strong>Visual timeline</strong>, click any cell, then click "📌 Add to my chronology" on the email. You can also use the same button at the bottom of any expanded email in the All emails view.</p>
      </div>
    </div>`;
    return;
  }
  const items = state.myChronology.slice().sort((a,b) => {
    const ra = BY_ID[a.id], rb = BY_ID[b.id];
    return (ra ? ra.date : a.added).localeCompare(rb ? rb.date : b.added);
  });
  pane.innerHTML = `<div class="my-chron">
    <div class="my-chron-actions">
      <button class="btn" id="exportChron">⤓ Export as JSON</button>
      <button class="btn" id="clearChron">Clear all</button>
      <span class="muted small">${items.length} pinned, sorted by email date.</span>
    </div>
    ${items.map(item => {
      const r = BY_ID[item.id]; if (!r) return "";
      const addedDate = item.added ? new Date(item.added).toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"}) : "";
      return `<div class="my-chron-item" data-id="${r.id}">
        <div class="head">
          <span class="when">${fmtDate(r.date)}</span>
          <span class="dir ${r.direction}">${r.direction === "Inbound" ? "IN" : "OUT"}</span>
          <span class="tag ${categoryClass(r.category)}">${esc(r.category)}</span>
        </div>
        <div class="subj">${esc(r.subject)}</div>
        <div class="summary">${esc(r.summary)}</div>
        <div class="my-note">
          <div class="my-note-label">Your note · added ${esc(addedDate)}</div>
          <textarea class="my-note-text" data-id="${r.id}" placeholder="Add or edit your note…">${esc(item.note || "")}</textarea>
        </div>
        <div class="item-actions">
          <a href="${r.url}" target="_blank" rel="noopener">↗ Open in Gmail</a>
          <button class="remove" data-remove-id="${r.id}">Remove</button>
        </div>
      </div>`;
    }).join("")}
  </div>`;
  pane.querySelectorAll(".my-note-text").forEach(ta => {
    ta.addEventListener("input", (e) => updateChronologyNote(ta.dataset.id, e.target.value));
  });
  pane.querySelectorAll("[data-remove-id]").forEach(btn => {
    btn.addEventListener("click", () => removeFromChronology(btn.dataset.removeId));
  });
  pane.querySelector("#exportChron")?.addEventListener("click", () => {
    const out = state.myChronology.map(item => {
      const r = BY_ID[item.id] || {};
      return { ...item, subject: r.subject, date: r.date, from: r.from, to: r.to, category: r.category, summary: r.summary, gmailUrl: r.url };
    });
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "my-releaf-chronology.json";
    a.click();
  });
  pane.querySelector("#clearChron")?.addEventListener("click", () => {
    if (confirm("Remove all " + state.myChronology.length + " pinned emails from your chronology?")) {
      state.myChronology = [];
      saveState(); updateSidebarCounts(); renderList();
    }
  });
}

  });
}

// ─── METHODOLOGY PAGE ──
function renderMethodology(pane) {
  document.getElementById("viewTitle").textContent = "Methodology";
  document.getElementById("viewMeta").textContent = "How this report was built";
  const tpl = document.getElementById("methodologyTemplate");
  pane.innerHTML = "";
  pane.appendChild(tpl.content.cloneNode(true));
}

// ── STATS PAGE ──
function renderStats(pane) {
  document.getElementById("viewTitle").textContent = "Overview";
  document.getElementById("viewMeta").textContent = "";
  const byCat = {}, byDir = {Inbound: 0, Outbound: 0}, byYear = {};
  let firstD = DATA[0].date, lastD = DATA[0].date;
  for (const r of DATA) {
    byCat[r.category] = (byCat[r.category]||0) + 1;
    byDir[r.direction]++;
    const y = r.date.slice(0,4);
    byYear[y] = (byYear[y]||0) + 1;
    if (r.date < firstD) firstD = r.date;
    if (r.date > lastD) lastD = r.date;
  }
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max = cats[0][1];
  pane.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="n">${DATA.length}</div><div class="l">Total emails</div></div>
      <div class="stat-card"><div class="n">${byDir.Inbound}</div><div class="l">Received</div></div>
      <div class="stat-card"><div class="n">${byDir.Outbound}</div><div class="l">Sent by you</div></div>
      <div class="stat-card"><div class="n">${cats.length}</div><div class="l">Categories</div></div>
      <div class="stat-card"><div class="n">${state.starred.size}</div><div class="l">Starred</div></div>
      <div class="stat-card"><div class="n">${state.flagged.size}</div><div class="l">Flagged</div></div>
    </div>
    <div class="cat-list">
      <div class="cat-card">
        <h3>Emails by category</h3>
        ${cats.map(([c,n]) => `
          <div class="bar-row">
            <span>${esc(c)}</span>
            <div class="bar"><span style="width:${(n/max)*100}%"></span></div>
            <span style="text-align:right;color:var(--muted)">${n}</span>
          </div>`).join("")}
      </div>
      <div class="cat-card">
        <h3>By year</h3>
        ${Object.entries(byYear).sort().map(([y,n]) => `
          <div class="bar-row">
            <span>${y}</span>
            <div class="bar"><span style="width:${(n/Math.max(...Object.values(byYear)))*100}%"></span></div>
            <span style="text-align:right;color:var(--muted)">${n}</span>
          </div>`).join("")}
      </div>
      <div class="cat-card">
        <h3>Key flashpoints</h3>
        <ul style="margin:0;padding-left:18px;line-height:1.7">
          <li><strong>Nov–Dec 2024</strong> · GP registration issues (AILSA, then phl adhd not recognised), multiple missed initial consultations.</li>
          <li><strong>Jan 2025</strong> · Proof of address required; first prescription begins shipping.</li>
          <li><strong>Jul 2025</strong> · Urgent address confirmation; vape battery confusion.</li>
          <li><strong>Oct 2025</strong> · Order not dispatched; you chased; refund issued (#3202-8689); Emily/Liberty resolved.</li>
          <li><strong>Dec 2025</strong> · Tech-failed consultation 18 Dec; appointment moved without notice; complaint drafts.</li>
          <li><strong>Jan 2026</strong> · Formal complaint about 3 Jan consultation notes; subscription dispute; many Stripe failures.</li>
          <li><strong>Feb 2026</strong> · GP letter returned again — "no longer registered".</li>
          <li><strong>May 2026</strong> · You're exploring Big Narstie Medical; Releaf escalated and issued 20% refund (£30.99); new appointment with Renae Carney on 21 May.</li>
        </ul>
      </div>
    </div>
  `;
}

// ── SIDEBAR NAV ──
document.getElementById("sidebar").addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]"); if (!btn) return;
  document.querySelectorAll("#sidebar .sb-item").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.view = btn.dataset.view;
  state.category = btn.dataset.cat || null;
  state.quick = null;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  // Clean up gantt-mode class when leaving the Visual Timeline page
  if (state.view !== "gantt") document.getElementById("listPane").classList.remove("gantt-mode");
  renderList();
});

// ── QUICK FILTERS ──
document.getElementById("quickFilters").addEventListener("click", e => {
  const p = e.target.closest(".pill"); if (!p) return;
  if (state.quick === p.dataset.quick) { state.quick = null; p.classList.remove("active"); }
  else {
    state.quick = p.dataset.quick;
    document.querySelectorAll(".pill").forEach(x => x.classList.remove("active"));
    p.classList.add("active");
  }
  renderList();
});

// ── SEARCH ──
let searchT;
document.getElementById("searchInput").addEventListener("input", e => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { state.search = e.target.value.trim(); renderList(); }, 120);
});

// ── KEYBOARD ──
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) {
    if (e.key === "Escape" && e.target.id === "searchInput") e.target.blur();
    return;
  }
  if (e.key === "/") { e.preventDefault(); document.getElementById("searchInput").focus(); }
  else if (e.key === "Escape") closeDrawer();
  else if (e.key === "s" && state.selectedId) toggleStar(state.selectedId);
  else if (e.key === "f" && state.selectedId) toggleFlag(state.selectedId);
  else if (e.key === "j" || e.key === "ArrowDown") moveSelection(1);
  else if (e.key === "k" || e.key === "ArrowUp") moveSelection(-1);
  else if (e.key === "Enter" && state.selectedId) openDrawer(state.selectedId);
});
function moveSelection(d) {
  const rows = [...document.querySelectorAll(".row")];
  if (!rows.length) return;
  const idx = rows.findIndex(r => r.dataset.id === state.selectedId);
  const next = rows[Math.max(0, Math.min(rows.length-1, (idx<0?0:idx) + d))];
  if (next) { state.selectedId = next.dataset.id; openDrawer(state.selectedId); next.scrollIntoView({ block: "nearest" }); }
}

// ── EXPORT ──
document.getElementById("exportBtn").addEventListener("click", () => {
  const out = {
    exportedAt: new Date().toISOString(),
    notes: state.notes,
    starred: [...state.starred],
    flagged: [...state.flagged],
    tags: state.tags,
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "releaf-notes-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
});

// ─── Pin button wiring (used by drawer, chronology page, and inline expanded rows) ──
function wirePinButtons(root) {
  const scope = root || document;
  scope.querySelectorAll("[data-pin-id]").forEach(btn => {
    if (btn.dataset.pinWired === "1") return;
    btn.dataset.pinWired = "1";
    // Reflect current state on initial render
    if (isInChronology(btn.dataset.pinId)) {
      btn.classList.add("pinned");
      btn.textContent = "✓ In my chronology";
    }
    btn.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      const id = btn.dataset.pinId;
      if (isInChronology(id)) {
        if (confirm("Remove this email from your chronology?")) removeFromChronology(id);
        return;
      }
      showPinNoteForm(btn, id);
    });
  });
}
function showPinNoteForm(btn, id) {
  if (btn.parentElement.querySelector(".pin-note-form")) return;
  const r = BY_ID[id];
  const form = document.createElement("div");
  form.className = "pin-note-form";
  form.innerHTML = `
    <div class="muted small" style="margin-bottom:6px">Add a note for "${esc(r ? r.subject : id)}" (optional):</div>
    <textarea placeholder="Why is this email important to you?"></textarea>
    <div class="actions">
      <button class="save" type="button">Save to chronology</button>
      <button class="cancel" type="button">Cancel</button>
    </div>
  `;
  btn.parentElement.appendChild(form);
  const ta = form.querySelector("textarea");
  ta.focus();
  form.querySelector(".save").addEventListener("click", () => {
    addToChronology(id, ta.value.trim());
    form.remove();
  });
  form.querySelector(".cancel").addEventListener("click", () => form.remove());
}

// Click the (invisible) scrim to close the reading pane
document.getElementById("scrim").addEventListener("click", closeCellDrawer);

// ── INIT ──
buildCategoryList();
updateSidebarCounts();

// Hook handlers onto the pre-rendered <details> rows. Rows expand inline
// via the native <details>/<summary> behavior — no JS needed for that.
// JS adds star/flag toggling and saves note text to localStorage.
function wireExistingRows() {
  const pane = document.getElementById("listPane");
  // Cache the list node so we can re-mount it after switching to special pages
  const inner = document.querySelector("#listInner");
  if (inner) cachedListNode = inner;

  pane.querySelectorAll(".row").forEach(row => {
    const id = row.dataset.id;
    if (state.starred.has(id)) {
      const s = row.querySelector(".star"); if (s) { s.classList.add("on"); s.textContent = "★"; }
    }
    if (state.flagged.has(id)) {
      const f = row.querySelector(".flag"); if (f) f.classList.add("on");
    }
    if (state.notes[id]) {
      row.classList.add("has-note");
      const ta = row.querySelector("textarea.note-inline");
      if (ta) ta.value = state.notes[id];
    }
    // Star/flag buttons inside the <summary>: prevent the click from
    // triggering the details toggle, then handle the action.
    row.querySelectorAll("[data-act]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const aid = btn.dataset.id;
        if (btn.dataset.act === "star") toggleStar(aid);
        if (btn.dataset.act === "flag") toggleFlag(aid);
      });
    });
    // Persist note edits
    const ta = row.querySelector("textarea.note-inline");
    if (ta) {
      ta.addEventListener("input", (e) => {
        const v = e.target.value.trim();
        if (v) state.notes[id] = v; else delete state.notes[id];
        row.classList.toggle("has-note", !!state.notes[id]);
        saveState(); updateSidebarCounts();
      });
    }
  });
  document.getElementById("viewMeta").textContent = pane.querySelectorAll(".row").length + " emails";
  wirePinButtons(pane);
}
wireExistingRows();
</script>
